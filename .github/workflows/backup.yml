name: Backup MongoDB

on:
  schedule:
    - cron: "0 6 * * *" # diário às 06:00 UTC (03:00 BRT)
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Sem pnpm: instala só o driver mongodb num diretório isolado (resolução
      # ESM acha o módulo ao lado do script) e roda o dump com node puro.
      - name: Dump das coleções
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          mkdir -p "$RUNNER_TEMP/bk"
          cp scripts/backup.mjs "$RUNNER_TEMP/bk/backup.mjs"
          cd "$RUNNER_TEMP/bk"
          npm init -y >/dev/null 2>&1
          npm install mongodb@7 --no-fund --no-audit >/dev/null
          BACKUP_DIR="$GITHUB_WORKSPACE/backup" node backup.mjs

      - name: Compacta e criptografa
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          tar czf backup.tar.gz -C backup .
          gpg --batch --yes --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 \
            -o backup.tar.gz.gpg backup.tar.gz

      - name: Sobe o artifact criptografado
        uses: actions/upload-artifact@v4
        with:
          name: mongo-backup-${{ github.run_id }}
          path: backup.tar.gz.gpg
          retention-days: 90
